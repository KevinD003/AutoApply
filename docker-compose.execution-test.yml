# TEST ONLY: adds the synthetic receiver (the oracle) and a canary for the browser-execution
# test (scripts/compose-execution-test.sh). Never use for real data or real destinations.
#
# `fixtures` is internal: only the egress proxy (the browser's only way out) and the API (which
# reads fixture forms when preparing) can reach the receiver and the canary. Nothing is
# published; the host-side test reaches the receiver's admin API with `docker compose exec`.
#
# D86: this stack runs as NOEFFORTS_ENV=test (fixture origins are honoured nowhere else), and
# `fixtures` has a fixed subnet that the API, the worker and the egress proxy each name as the
# only private network a fixture host may resolve to; the address every connection reaches is
# checked against it (loopback aside). `receiver` is the one name a fixture origin may use
# (urlsafety.FIXTURE_SERVICE_HOSTS); a bare name resolving anywhere else is refused.
x-fixture-network: &fixture-network "10.231.47.0/24"

services:
  receiver:
    build: ./backend
    command: ["python", "/fixture/receiver.py", "--host", "0.0.0.0", "--port", "8799",
              "--ledger", "/tmp/ledger.db",
              "--admin-token", "${RECEIVER_ADMIN_TOKEN:?set RECEIVER_ADMIN_TOKEN}"]
    volumes: ["./fixtures/ats_receiver:/fixture:ro"]
    networks:
      fixtures:
        # A second name for the same receiver: the "dependency origin" of the read-only B3
        # policy scenario (another origin, so the policy and the proxy treat it separately).
        aliases: [cdn-fixture]

  canary:
    # Logs every request it receives; the test asserts there are none.
    build: ./backend
    command: ["python", "-u", "-c", "import http.server as h\nclass H(h.BaseHTTPRequestHandler):\n def do_GET(s):\n  print('CANARY-HIT', s.command, s.path, flush=True); s.send_response(200); s.end_headers()\n do_POST = do_GET\n def log_message(s, *a): pass\nh.ThreadingHTTPServer(('0.0.0.0', 8798), H).serve_forever()"]
    networks: [fixtures]

  egress-proxy:
    environment:
      EGRESS_FIXTURE_NETWORKS: '["10.231.47.0/24"]'
    networks: [exec_egress, fixtures]

  backend:
    environment:
      NOEFFORTS_ENV: test
      NOEFFORTS_FIXTURE_NETWORKS: '["10.231.47.0/24"]'
    networks: [default, fixtures]

  worker:
    environment:
      NOEFFORTS_ENV: test
      NOEFFORTS_FIXTURE_NETWORKS: '["10.231.47.0/24"]'
      NOEFFORTS_SUBMIT_TIMEOUT_SECONDS: "10"
      NOEFFORTS_CHECKPOINT_TTL_SECONDS: "120"
      NOEFFORTS_OUTBOX_RELAY_INTERVAL_SECONDS: "1"
      NOEFFORTS_NAVIGATION_TIMEOUT_SECONDS: "60"
      # Off unless a scenario recreates the worker with it on (infrastructure-only egress test).
      NOEFFORTS_EXECUTION_TEST_DISABLE_INTERCEPTION: ${EXEC_TEST_DISABLE_INTERCEPTION:-false}

networks:
  fixtures:
    internal: true
    ipam:
      config: [{ subnet: *fixture-network }]
