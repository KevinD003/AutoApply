# Local stack. Not hardened for production; see docs/architecture.md and
# docs/execution-service.md (browser execution).
#
# Networks: `default` carries the application (database, broker, API, worker, web). Browser
# execution uses two internal networks so the browser container can reach only the egress
# proxy (and is reachable by the worker), never the database, broker, API or the internet:
#   exec_control   worker <-> browser-runner (Playwright protocol)
#   exec_egress    browser-runner -> egress-proxy port 3128 (the browser's only way out)
# The proxy's management API is not on any network: it is a UNIX socket on the
# `egress_control` volume, mounted only into egress-proxy and the worker.
# In this file the proxy has no outbound network at all: no real destination is reachable.
services:
  postgres:
    image: postgres:16
    # The server's log keeps errors without their DETAIL, which can quote key or row values
    # (for example "Failing row contains (...)"). The app's statements are parameterized, so a
    # logged statement shows placeholders ($1), not values.
    command: ["postgres", "-c", "log_error_verbosity=terse"]
    environment:
      POSTGRES_DB: noefforts
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["127.0.0.1:6379:6379"]

  backend:
    build: ./backend
    environment: &backend-env
      NOEFFORTS_DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/noefforts
      NOEFFORTS_REDIS_URL: redis://redis:6379/0
      NOEFFORTS_CORS_ORIGINS: '["http://localhost:3000"]'
      NOEFFORTS_BROWSER_ISOLATION: container
      NOEFFORTS_AUDIT_REF_KEY: ${AUDIT_REF_KEY:?set AUDIT_REF_KEY in .env}
      NOEFFORTS_FIXTURE_ORIGINS: ${NOEFFORTS_FIXTURE_ORIGINS:-[]}
      # Owner settings from .env. Compose reads .env only to fill in this file, so each one the
      # API or worker needs is named here (no env_file: the runner and proxy secrets stay out
      # of these containers). Defaults are the code's; every outside service stays off.
      NOEFFORTS_COOKIE_SECURE: ${NOEFFORTS_COOKIE_SECURE:-false}
      NOEFFORTS_SESSION_TTL_HOURS: ${NOEFFORTS_SESSION_TTL_HOURS:-168}
      NOEFFORTS_FOLLOW_UP_DAYS: ${NOEFFORTS_FOLLOW_UP_DAYS:-7}
      NOEFFORTS_MAX_UPLOAD_BYTES: ${NOEFFORTS_MAX_UPLOAD_BYTES:-10485760}
      NOEFFORTS_MAX_IMPORT_ROWS: ${NOEFFORTS_MAX_IMPORT_ROWS:-5000}
      NOEFFORTS_DISCOVERY_PROVIDERS: ${NOEFFORTS_DISCOVERY_PROVIDERS:-[]}
      NOEFFORTS_DISCOVERY_OWNER_EMAILS: ${NOEFFORTS_DISCOVERY_OWNER_EMAILS:-[]}
      NOEFFORTS_FREEHIRE_DAILY_REQUEST_BUDGET: ${NOEFFORTS_FREEHIRE_DAILY_REQUEST_BUDGET:-1440}
      NOEFFORTS_FREEHIRE_BASE_URL: ${NOEFFORTS_FREEHIRE_BASE_URL:-}
      NOEFFORTS_FREEHIRE_API_KEY: ${NOEFFORTS_FREEHIRE_API_KEY:-}
      NOEFFORTS_DRAFTING_PROVIDER: ${NOEFFORTS_DRAFTING_PROVIDER:-}
      NOEFFORTS_DRAFTING_OWNER_EMAILS: ${NOEFFORTS_DRAFTING_OWNER_EMAILS:-[]}
      NOEFFORTS_DRAFTING_DAILY_BUDGET_USD: ${NOEFFORTS_DRAFTING_DAILY_BUDGET_USD:-0}
      NOEFFORTS_ANTHROPIC_API_KEY: ${NOEFFORTS_ANTHROPIC_API_KEY:-}
      NOEFFORTS_EMAIL_ENABLED: ${NOEFFORTS_EMAIL_ENABLED:-false}
      NOEFFORTS_EMAIL_SMTP_HOST: ${NOEFFORTS_EMAIL_SMTP_HOST:-}
      NOEFFORTS_EMAIL_SMTP_PORT: ${NOEFFORTS_EMAIL_SMTP_PORT:-587}
      NOEFFORTS_EMAIL_SMTP_STARTTLS: ${NOEFFORTS_EMAIL_SMTP_STARTTLS:-true}
      NOEFFORTS_EMAIL_SMTP_USERNAME: ${NOEFFORTS_EMAIL_SMTP_USERNAME:-}
      NOEFFORTS_EMAIL_SMTP_PASSWORD: ${NOEFFORTS_EMAIL_SMTP_PASSWORD:-}
      NOEFFORTS_EMAIL_FROM: ${NOEFFORTS_EMAIL_FROM:-}
      NOEFFORTS_EMAIL_RECIPIENT_DOMAINS: ${NOEFFORTS_EMAIL_RECIPIENT_DOMAINS:-[]}
      NOEFFORTS_PUBLIC_BASE_URL: ${NOEFFORTS_PUBLIC_BASE_URL:-http://localhost:3000}
      NOEFFORTS_BOARD_SOURCES_ENABLED: ${NOEFFORTS_BOARD_SOURCES_ENABLED:-false}
      NOEFFORTS_INBOX_ENABLED: ${NOEFFORTS_INBOX_ENABLED:-false}
      NOEFFORTS_INBOX_OWNER_EMAILS: ${NOEFFORTS_INBOX_OWNER_EMAILS:-[]}
      NOEFFORTS_INBOX_TOKEN_FILE: ${NOEFFORTS_INBOX_TOKEN_FILE:-}
      # D102: the Greenhouse pilot; it also needs production mode (docker-compose.pilot.yml).
      NOEFFORTS_LIVE_GREENHOUSE_ENABLED: ${NOEFFORTS_LIVE_GREENHOUSE_ENABLED:-false}
      NOEFFORTS_LIVE_OWNER_EMAILS: ${NOEFFORTS_LIVE_OWNER_EMAILS:-[]}
    volumes: [storage:/data/storage]
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    # Healthy once migrations have run (they run before the server starts) and the API answers
    # /api/health, which checks the database. No proxy: a Docker Desktop proxy setting must not
    # route this local probe.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.build_opener(u.ProxyHandler({})).open('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 24

  worker:
    build: ./backend
    command: ["celery", "-A", "app.worker", "worker", "--beat", "--loglevel=info", "--concurrency=2"]
    environment:
      <<: *backend-env
      NOEFFORTS_BROWSER_RUNNER_URL: http://browser-runner:9330
      NOEFFORTS_BROWSER_RUNNER_TOKEN: ${BROWSER_RUNNER_TOKEN:?set BROWSER_RUNNER_TOKEN in .env}
      NOEFFORTS_EGRESS_CONTROL_SOCKET: /run/egress-control/control.sock
      NOEFFORTS_EGRESS_CONTROL_TOKEN: ${EGRESS_CONTROL_TOKEN:?set EGRESS_CONTROL_TOKEN in .env}
    volumes: [storage:/data/storage, egress_control:/run/egress-control:ro]
    networks: [default, exec_control]
    depends_on:
      backend: { condition: service_healthy }  # never on a database still being migrated

  browser-runner:
    build: ./browser
    environment:
      RUNNER_TOKEN: ${BROWSER_RUNNER_TOKEN:?set BROWSER_RUNNER_TOKEN in .env}
      EGRESS_PROXY: http://egress-proxy:3128
      RUNNER_PUBLIC_HOST: browser-runner
      MAX_SESSIONS: "1"  # one browser per runner: sessions in one container share a user
      MAX_SESSION_SECONDS: ${BROWSER_MAX_SESSION_SECONDS:-600}
    networks: [exec_control, exec_egress]
    user: "10002:10002"
    read_only: true
    tmpfs: ["/tmp:size=512m,mode=1777"]
    shm_size: 256m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      # Docker's default profile plus the four calls Chromium's sandbox needs (browser/README.md).
      - seccomp=${BROWSER_SECCOMP_PROFILE:-./browser/seccomp.json}
    mem_limit: 1536m
    memswap_limit: 1536m
    cpus: 1.5
    pids_limit: 512
    ulimits:
      nofile: { soft: 4096, hard: 4096 }
    restart: unless-stopped

  egress-proxy:
    build: ./backend
    command: ["python", "-m", "app.modules.execution.sandbox.proxy_service"]
    environment:
      EGRESS_CONTROL_TOKEN: ${EGRESS_CONTROL_TOKEN:?set EGRESS_CONTROL_TOKEN in .env}
      EGRESS_CONTROL_SOCKET: /run/egress-control/control.sock
    volumes: [egress_control:/run/egress-control]
    networks: [exec_egress]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args: { NOEFFORTS_BACKEND_URL: "http://backend:8000" }
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      backend: { condition: service_healthy }

networks:
  default: {}
  exec_control: { internal: true }
  exec_egress: { internal: true }

volumes:
  pgdata:
  storage:
  egress_control:
