<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>NoEfforts: save this job — options</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 36rem; margin: 1.5rem auto; padding: 0 1rem; color: #0f172a; }
  label { display: block; margin: .75rem 0 .25rem; font-weight: 600; }
  input { width: 100%; font: inherit; padding: .4rem; box-sizing: border-box; }
  button { font: inherit; padding: .4rem .8rem; margin-top: .75rem; border-radius: .375rem; border: 1px solid #0f172a; background: #0f172a; color: #fff; }
  .muted { color: #475569; }
</style></head>
<body>
  <h1>NoEfforts: save this job</h1>
  <p class="muted">The extension sends a job page's address and title to your own NoEfforts on this machine, with a
    token from Account → API tokens that has only the <code>import:jobs</code> scope (it can add jobs, nothing else).
    It never reads, fills or submits a page.</p>
  <label for="base">NoEfforts address</label>
  <input id="base" type="url" placeholder="http://127.0.0.1:3000" autocomplete="off">
  <label for="token">Token</label>
  <input id="token" type="password" placeholder="ne_…" autocomplete="off">
  <p id="token-state" class="muted"></p>
  <button type="button" id="save">Save</button>
  <button type="button" id="forget">Remove the token</button>
  <p id="status" role="status" aria-live="polite"></p>
  <script type="module" src="options.js"></script>
</body>
</html>
